[package]
name = "forestx-app-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "forestx-app-server"
path = "src/main.rs"

[[bin]]
name = "forestx-app-server-test-notify-capture"
path = "src/bin/notify_capture.rs"

[[bin]]
name = "exec-server"
path = "src/bin/exec_server.rs"

[lib]
name = "forestx_app_server"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
axum = { workspace = true, default-features = false, features = [
    "http1",
    "json",
    "tokio",
    "ws",
] }
forestx-analytics = { workspace = true }
forestx-agent-extension = { workspace = true }
forestx-arg0 = { workspace = true }
forestx-cloud-config = { workspace = true }
forestx-code-mode = { workspace = true }
forestx-config = { workspace = true }
forestx-connectors = { workspace = true }
forestx-core = { workspace = true }
forestx-core-plugins = { workspace = true }
forestx-home = { workspace = true }
forestx-exec-server = { workspace = true }
forestx-extension-api = { workspace = true }
forestx-external-agent-migration = { workspace = true }
forestx-features = { workspace = true }
forestx-goal-extension = { workspace = true }
forestx-git-attribution = { workspace = true }
forestx-guardian = { workspace = true }
forestx-git-utils = { workspace = true }
forestx-file-watcher = { workspace = true }
forestx-hooks = { workspace = true }
forestx-http-client = { workspace = true }
forestx-otel = { workspace = true }
forestx-plugin = { workspace = true }
forestx-shell-command = { workspace = true }
forestx-skills = { workspace = true }
forestx-skills-extension = { workspace = true }
forestx-utils-cli = { workspace = true }
forestx-utils-pty = { workspace = true }
forestx-backend-client = { workspace = true }
forestx-file-search = { workspace = true }
forestx-chatgpt = { workspace = true }
forestx-login = { workspace = true }
forestx-image-generation-extension = { workspace = true }
forestx-memories-extension = { workspace = true }
forestx-web-search-extension = { workspace = true }
forestx-memories-write = { workspace = true }
forestx-mcp = { workspace = true }
forestx-mcp-extension = { workspace = true }
forestx-model-provider = { workspace = true }
forestx-models-manager = { workspace = true }
forestx-protocol = { workspace = true }
forestx-app-server-protocol = { workspace = true }
forestx-app-server-transport = { workspace = true }
forestx-feedback = { workspace = true }
forestx-rmcp-client = { workspace = true }
forestx-rollout = { workspace = true }
forestx-sandboxing = { workspace = true }
forestx-state = { workspace = true }
forestx-thread-store = { workspace = true }
forestx-tools = { workspace = true }
forestx-utils-absolute-path = { workspace = true }
forestx-utils-json-to-toml = { workspace = true }
forestx-utils-path-uri = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive"] }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
] }
tokio-util = { workspace = true }
tracing = { workspace = true, features = ["log"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json"] }
