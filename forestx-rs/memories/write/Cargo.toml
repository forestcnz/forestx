[package]
edition.workspace = true
license.workspace = true
name = "forestx-memories-write"
version.workspace = true

[lib]
name = "forestx_memories_write"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
forestx-backend-client = { workspace = true }
forestx-core = { workspace = true }
forestx-config = { workspace = true }
forestx-features = { workspace = true }
forestx-git-utils = { workspace = true }
forestx-login = { workspace = true }
forestx-model-provider = { workspace = true }
forestx-otel = { workspace = true }
forestx-protocol = { workspace = true }
forestx-rollout = { workspace = true }
forestx-rollout-trace = { workspace = true }
forestx-secrets = { workspace = true }
forestx-state = { workspace = true }
forestx-terminal-detection = { workspace = true }
forestx-utils-absolute-path = { workspace = true }
forestx-utils-output-truncation = { workspace = true }
forestx-utils-template = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt", "sync", "time"] }
tracing = { workspace = true, features = ["log"] }
uuid = { workspace = true, features = ["v4", "v5"] }

[dev-dependencies]
forestx-model-provider-info = { workspace = true }
forestx-models-manager = { workspace = true }
core_test_support = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
wiremock = { workspace = true }
