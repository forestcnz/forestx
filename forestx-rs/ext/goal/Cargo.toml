[package]
edition.workspace = true
license.workspace = true
name = "forestx-goal-extension"
version.workspace = true

[lib]
name = "forestx_goal_extension"
path = "src/lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
forestx-analytics = { workspace = true }
forestx-core = { workspace = true }
forestx-extension-api = { workspace = true }
forestx-otel = { workspace = true }
forestx-protocol = { workspace = true }
forestx-state = { workspace = true }
forestx-tools = { workspace = true }
forestx-utils-template = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
forestx-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
