[package]
edition.workspace = true
license.workspace = true
name = "forestx-analytics"
version.workspace = true

[lib]
doctest = false
name = "forestx_analytics"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
forestx-app-server-protocol = { workspace = true }
forestx-git-utils = { workspace = true }
forestx-login = { workspace = true }
forestx-model-provider = { workspace = true }
forestx-plugin = { workspace = true }
forestx-protocol = { workspace = true }
forestx-state = { workspace = true }
os_info = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha1 = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
forestx-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
