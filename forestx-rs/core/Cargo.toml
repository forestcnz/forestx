[package]
edition.workspace = true
license.workspace = true
name = "forestx-core"
version.workspace = true

[lib]
name = "forestx_core"
path = "src/lib.rs"

[[bin]]
name = "forestx-write-config-schema"
path = "src/bin/config_schema.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-channel = { workspace = true }
base64 = { workspace = true }
bm25 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["derive"] }
forestx-analytics = { workspace = true }
forestx-agent-graph-store = { workspace = true }
forestx-api = { workspace = true }
forestx-app-server-protocol = { workspace = true }
forestx-apply-patch = { workspace = true }
forestx-async-utils = { workspace = true }
forestx-code-mode = { workspace = true }
forestx-connectors = { workspace = true }
forestx-context-fragments = { workspace = true }
forestx-config = { workspace = true }
forestx-core-plugins = { workspace = true }
forestx-core-skills = { workspace = true }
forestx-exec-server = { workspace = true }
forestx-extension-api = { workspace = true }
forestx-extension-items = { workspace = true }
forestx-features = { workspace = true }
forestx-feedback = { workspace = true }
forestx-file-system = { workspace = true }
forestx-login = { workspace = true }
forestx-memories-read = { workspace = true }
forestx-mcp = { workspace = true }
forestx-model-provider-info = { workspace = true }
forestx-models-manager = { workspace = true }
forestx-shell-command = { workspace = true }
forestx-execpolicy = { workspace = true }
forestx-git-utils = { workspace = true }
forestx-hooks = { workspace = true }
forestx-http-client = { workspace = true }
forestx-install-context = { workspace = true }
forestx-network-proxy = { workspace = true }
forestx-otel = { workspace = true }
forestx-plugin = { workspace = true }
forestx-model-provider = { workspace = true }
forestx-protocol = { workspace = true }
forestx-response-debug-context = { workspace = true }
forestx-prompts = { workspace = true }
forestx-rollout = { workspace = true }
forestx-rollout-trace = { workspace = true }
forestx-rmcp-client = { workspace = true }
forestx-sandboxing = { workspace = true }
forestx-skills = { workspace = true }
forestx-skills-extension = { workspace = true }
forestx-state = { workspace = true }
forestx-terminal-detection = { workspace = true }
forestx-thread-store = { workspace = true }
forestx-tools = { workspace = true }
forestx-utils-absolute-path = { workspace = true }
forestx-utils-audio = { workspace = true }
forestx-utils-cache = { workspace = true }
forestx-utils-image = { workspace = true }
forestx-utils-home-dir = { workspace = true }
forestx-utils-output-truncation = { workspace = true }
forestx-utils-path = { workspace = true }
forestx-utils-path-uri = { workspace = true }
forestx-utils-plugins = { workspace = true }
forestx-utils-pty = { workspace = true }
forestx-utils-string = { workspace = true }
forestx-utils-stream-parser = { workspace = true }
forestx-windows-sandbox = { package = "forestx-windows-sandbox", path = "../windows-sandbox-rs" }
dirs = { workspace = true }
dunce = { workspace = true }
eventsource-stream = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
iana-time-zone = { workspace = true }
image = { workspace = true, features = ["jpeg", "png", "webp"] }
indexmap = { workspace = true }
libc = { workspace = true }
once_cell = { workspace = true }
rand = { workspace = true }
regex-lite = { workspace = true }
rmcp = { workspace = true, default-features = false, features = [
    "base64",
    "macros",
    "schemars",
    "server",
] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha1 = { workspace = true }
shlex = { workspace = true }
similar = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
] }
tokio-util = { workspace = true, features = ["rt"] }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true, features = ["log"] }
url = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4", "v5", "v7"] }
which = { workspace = true }
whoami = { workspace = true }

# Build OpenSSL from source for musl builds.
[target.x86_64-unknown-linux-musl.dependencies]
openssl-sys = { workspace = true, features = ["vendored"] }

# Build OpenSSL from source for musl builds.
[target.aarch64-unknown-linux-musl.dependencies]
openssl-sys = { workspace = true, features = ["vendored"] }

[target.'cfg(unix)'.dependencies]
forestx-shell-escalation = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
assert_matches = { workspace = true }
forestx-exec-server-test-support = { workspace = true }
forestx-image-generation-extension = { workspace = true }
forestx-home = { workspace = true }
forestx-otel = { workspace = true }
forestx-test-binary-support = { workspace = true }
forestx-utils-cargo-bin = { workspace = true }
forestx-web-search-extension = { workspace = true }
core_test_support = { workspace = true }
ctor = { workspace = true }
insta = { workspace = true }
maplit = { workspace = true }
opentelemetry = { workspace = true }
predicates = { workspace = true }
pretty_assertions = { workspace = true }
test-case = "3.3.1"
opentelemetry_sdk = { workspace = true, features = [
    "experimental_metrics_custom_reader",
    "metrics",
] }
serial_test = { workspace = true }
tempfile = { workspace = true }
test-log = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-test = { workspace = true, features = ["no-env-filter"] }
walkdir = { workspace = true }
wiremock = { workspace = true }
zstd = { workspace = true }

[package.metadata.cargo-shear]
ignored = ["openssl-sys"]
ignored-paths = ["tests/remote_env_windows/*.rs"]
