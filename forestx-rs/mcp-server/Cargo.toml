[package]
name = "forestx-mcp-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "forestx-mcp-server"
path = "src/main.rs"

[lib]
name = "forestx_mcp_server"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
forestx-arg0 = { workspace = true }
forestx-config = { workspace = true }
forestx-core = { workspace = true }
forestx-home = { workspace = true }
forestx-image-generation-extension = { workspace = true }
forestx-exec-server = { workspace = true }
forestx-extension-api = { workspace = true }
forestx-features = { workspace = true }
forestx-git-attribution = { workspace = true }
forestx-login = { workspace = true }
forestx-otel = { workspace = true }
forestx-protocol = { workspace = true }
forestx-skills-extension = { workspace = true }
forestx-utils-cli = { workspace = true }
forestx-utils-json-to-toml = { workspace = true }
rmcp = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
shlex = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
] }
tracing = { workspace = true, features = ["log"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
app_test_support = { workspace = true }
forestx-utils-absolute-path = { workspace = true }
forestx-shell-command = { workspace = true }
core_test_support = { workspace = true }
mcp_test_support = { workspace = true }
os_info = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }
