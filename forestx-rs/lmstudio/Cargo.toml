[package]
name = "forestx-lmstudio"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "forestx_lmstudio"
path = "src/lib.rs"
doctest = false


[dependencies]
forestx-core = { path = "../core" }
forestx-http-client = { workspace = true }
forestx-model-provider-info = { path = "../model-provider-info" }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
tracing = { version = "0.1.44", features = ["log"] }
which = "8.0"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
