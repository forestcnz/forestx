[package]
name = "forestx-app-server-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "forestx_app_server_client"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
forestx-app-server = { workspace = true }
forestx-app-server-protocol = { workspace = true }
forestx-arg0 = { workspace = true }
forestx-config = { workspace = true }
forestx-core = { workspace = true }
forestx-exec-server = { workspace = true }
forestx-feedback = { workspace = true }
forestx-protocol = { workspace = true }
forestx-uds = { workspace = true }
forestx-utils-absolute-path = { workspace = true }
forestx-utils-rustls-provider = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
