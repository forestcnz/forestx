[package]
name = "forestx-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
default-run = "forestx"

[[bin]]
name = "forestx"
path = "src/main.rs"

[[bin]]
name = "logs_client"
path = "src/bin/logs_client.rs"

[lib]
name = "forestx_cli"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
clap_complete = { workspace = true }
forestx-app-server = { workspace = true }
forestx-app-server-daemon = { workspace = true }
forestx-app-server-protocol = { workspace = true }
forestx-app-server-test-client = { workspace = true }
forestx-arg0 = { workspace = true }
forestx-api = { workspace = true }
forestx-chatgpt = { workspace = true }
forestx-cloud-config = { workspace = true }
forestx-cloud-tasks = { path = "../cloud-tasks" }
forestx-utils-cli = { workspace = true }
forestx-config = { workspace = true }
forestx-core = { workspace = true }
forestx-core-plugins = { workspace = true }
forestx-home = { workspace = true }
forestx-http-client = { workspace = true }
forestx-exec = { workspace = true }
forestx-exec-server = { workspace = true }
forestx-execpolicy = { workspace = true }
forestx-extension-api = { workspace = true }
forestx-features = { workspace = true }
forestx-git-attribution = { workspace = true }
forestx-git-utils = { workspace = true }
forestx-install-context = { workspace = true }
forestx-login = { workspace = true }
forestx-memories-write = { workspace = true }
forestx-mcp = { workspace = true }
forestx-mcp-server = { workspace = true }
forestx-model-provider = { workspace = true }
forestx-models-manager = { workspace = true }
forestx-plugin = { workspace = true }
forestx-protocol = { workspace = true }
forestx-responses-api-proxy = { workspace = true }
forestx-rmcp-client = { workspace = true }
forestx-rollout = { workspace = true }
forestx-rollout-trace = { workspace = true }
forestx-sandboxing = { workspace = true }
forestx-skills-extension = { workspace = true }
forestx-state = { workspace = true }
forestx-stdio-to-uds = { workspace = true }
forestx-terminal-detection = { workspace = true }
forestx-tui = { workspace = true }
forestx-utils-absolute-path = { workspace = true }
forestx-utils-path = { workspace = true }
crossterm = { workspace = true }
http = { workspace = true }
libc = { workspace = true }
os_info = { workspace = true }
owo-colors = { workspace = true }
regex-lite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
supports-color = { workspace = true }
sys-locale = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "time",
] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-segmentation = { workspace = true }
url = { workspace = true }
which = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
forestx_windows_sandbox = { package = "forestx-windows-sandbox", path = "../windows-sandbox-rs" }
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

[dev-dependencies]
app_test_support = { workspace = true }
assert_cmd = { workspace = true }
assert_matches = { workspace = true }
forestx-utils-cargo-bin = { workspace = true }
futures = { workspace = true }
insta = { workspace = true }
predicates = { workspace = true }
pretty_assertions = { workspace = true }
sqlx = { workspace = true }
tokio-tungstenite = { workspace = true }
wiremock = { workspace = true }
zstd = { workspace = true }

[package.metadata.cargo-shear]
# These Rust sources are intentionally Bazel-only macrobenchmarks rather than
# Cargo targets.
ignored-paths = ["e2e_benches/*.rs"]
