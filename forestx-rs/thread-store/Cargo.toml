[package]
edition.workspace = true
license.workspace = true
name = "forestx-thread-store"
version.workspace = true

[lib]
name = "forestx_thread_store"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
chrono = { workspace = true, features = ["serde"] }
forestx-app-server-protocol = { workspace = true }
forestx-git-utils = { workspace = true }
forestx-install-context = { workspace = true }
forestx-otel = { workspace = true }
forestx-protocol = { workspace = true }
forestx-rollout = { workspace = true }
forestx-state = { workspace = true }
forestx-utils-absolute-path = { workspace = true }
forestx-utils-path = { workspace = true }
futures = { workspace = true }
pulldown-cmark = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
forestx-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
uuid = { workspace = true }
zstd = { workspace = true }
