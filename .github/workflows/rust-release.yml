name: rust-release
on:
  push:
    tags:
      - "rust-v*.*.*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  tag-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - name: Validate tag matches Cargo.toml version
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_TYPE}" == "tag" ]] || { echo "not a tag ref"; exit 1; }
          [[ "${GITHUB_REF_NAME}" =~ ^rust-v[0-9]+\.[0-9]+\.[0-9]+(-(alpha(\.[0-9]+){0,2}|beta(\.[0-9]+)?))?$ ]] \
            || { echo "tag '${GITHUB_REF_NAME}' doesn't match expected format"; exit 1; }
          tag_ver="${GITHUB_REF_NAME#rust-v}"
          cargo_ver="$(grep -m1 '^version' forestx-rs/Cargo.toml | sed -E 's/version *= *"([^"]+)".*/\1/')"
          [[ "${tag_ver}" == "${cargo_ver}" ]] \
            || { echo "tag ${tag_ver} != Cargo.toml ${cargo_ver}"; exit 1; }

  build-linux:
    needs: tag-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - name: Build forestx CLI (release)
        working-directory: forestx-rs
        run: cargo build --release --bin forestx
      - name: Rename binary with target suffix
        run: |
          mkdir -p dist
          cp forestx-rs/target/release/forestx dist/forestx-x86_64-unknown-linux-gnu
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: forestx-x86_64-unknown-linux-gnu
          path: dist/forestx-x86_64-unknown-linux-gnu

  release:
    needs: [tag-check, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: forestx-x86_64-unknown-linux-gnu
          path: dist
      - name: Create GitHub release with binary
        uses: softprops/action-gh-release@v2
        with:
          files: dist/forestx-x86_64-unknown-linux-gnu
          generate_release_notes: true
